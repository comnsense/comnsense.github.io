<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подготовка на kazus.html</title>
</head>
<body>
  <h1>Подготовка на kazus.html</h1>
  <label for="source">Избери kazus_svilen.html</label>
  <input id="source" type="file" accept=".html,text/html">
  <button id="save" type="button">Изтегли kazus.html</button>
  <p id="status" role="status"></p>

  <script>
    const source = document.getElementById('source');
    const status = document.getElementById('status');



    document.getElementById('save').addEventListener('click', async () => {
      const file = source.files[0];
      if (!file) {
        status.textContent = 'Първо избери файла на казуса.';
        return;
      }

      try {
        const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
        for (const a of doc.querySelectorAll('a[href]')) {
          const href = a.getAttribute('href');
          if (href === '#turkey') a.setAttribute('href', './turcia.html');
          if (/^https?:/i.test(href) && new URL(href).searchParams.has('file_id')) {
            const label = a.textContent.trim();
            if (/PDF.*хронология/i.test(label)) a.setAttribute('href', './hronologia.pdf');
            else if (/хронология/i.test(label)) a.setAttribute('href', './klinichna_hronologia.html');
            else a.replaceWith(doc.createTextNode(label));
          }
        }
        const html = '<!doctype html>' + doc.documentElement.outerHTML;
        const url = URL.createObjectURL(new Blob([html], {
          type: 'text/html;charset=utf-8'
        }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'kazus.html';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = 'Готово. Изтегли се kazus.html.';
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
